# Worker delle notifiche push di Muovi Bologna.
# Deploy:  npx wrangler deploy --config push/wrangler.toml
# La chiave privata VAPID e il soggetto sono segreti:
#   npx wrangler secret put VAPID_PRIVATE_JWK --config push/wrangler.toml
#   npx wrangler secret put VAPID_SUBJECT     --config push/wrangler.toml

name = "muovi-bologna-push"
main = "worker.js"
compatibility_date = "2026-01-01"

[observability]
enabled = true

[vars]
# Origine dell'app: accetta solo richieste da qui (elenco separato da virgole).
ORIGIN = "https://supercoding2012.github.io"
# Output di `node push/genera-chiavi.js` (coppia generata il 28 novembre 2026).
VAPID_PUBLIC = "BI7YVv2L7m3M1XMJxXCfFcEVqfsf-sm5mTTp8lnIC1XdE3jwJ_rpmLPZ8mI_ZzQtCoNUA1Gm47nliJFW6qsWZa8"

[[kv_namespaces]]
binding = "PUSH_KV"
id = "SOSTITUISCI_CON_L_ID_DEL_NAMESPACE"

[triggers]
# Ogni minuto: i promemoria sono al minuto, non al quarto d'ora.
crons = ["* * * * *"]
