<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muovi Bologna</title>
<meta name="description" content="Muovi Bologna: percorso, costo del biglietto e orari in tempo reale dei bus TPER di Bologna e provincia">
<meta name="theme-color" content="#FFFFFF">
<meta name="application-name" content="Muovi Bologna">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muovi Bologna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --rosso:#C1121F;          /* 5.9:1 su bianco */
    --testo:#1A1A1A;          /* 15.9:1 */
    --testo-2:#6B6B6B;        /* 5.1:1 */
    --sup:#FFFFFF;
    --bordo:#EBEBEB;
    --bordo-2:#DADADA;
    --ombra:0 2px 4px rgba(0,0,0,.10);
    --r-sheet:16px;
    --r-card:12px;
    --barra:56px;
    --peek:168px;
    --font:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--sup);color:var(--testo);font-family:var(--font);-webkit-font-smoothing:antialiased;}
  body{font-size:14px;line-height:1.45;}
  button{font-family:inherit;color:inherit;}
  svg{display:block;}
  [hidden]{display:none !important;}
  :focus-visible{outline:2px solid var(--rosso);outline-offset:2px;}

  /* ---------- Mappa ---------- */
  #mappa{position:fixed;inset:0;background:#EFEFEF;z-index:0;}
  #mappa.senza-mappa{display:flex;align-items:center;justify-content:center;background:#F4F4F4;}
  #mappa.senza-mappa p{font-size:13px;color:var(--testo-2);background:#fff;border:1px solid var(--bordo);padding:12px 16px;border-radius:var(--r-card);max-width:280px;text-align:center;}
  .maplibregl-ctrl-bottom-left{bottom:calc(var(--h-sheet,168px) + 6px);z-index:900;}
  .maplibregl-ctrl-attrib{font-size:10px !important;background:rgba(255,255,255,.94) !important;border:1px solid var(--bordo);border-radius:8px;color:var(--testo-2);}
  .maplibregl-ctrl-attrib a{color:var(--testo-2);}
  .pin-mappa{cursor:pointer;}
  .pin-mappa svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));transition:transform .15s ease;}
  .pin-mappa:active svg{transform:scale(.95);}

  /* ---------- Top bar ---------- */
  .barra{position:fixed;top:0;left:0;right:0;height:calc(var(--barra) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;background:var(--sup);border-bottom:1px solid var(--bordo);display:flex;align-items:center;gap:4px;z-index:1000;}
  .barra.percorso{height:calc(44px + env(safe-area-inset-top,0px));}
  .icona{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--testo);}
  .icona:active{background:#F4F4F4;}
  .barra .spazio{flex:1;}
  .pill-offline{font-size:11px;font-weight:600;color:var(--testo-2);background:#F2F2F2;border-radius:999px;padding:4px 10px;}

  /* Pulsante mappa: inquadra il percorso */
  .mappa-btn{position:fixed;right:12px;z-index:900;width:44px;height:44px;border:0;border-radius:12px;background:var(--sup);box-shadow:var(--ombra);display:flex;align-items:center;justify-content:center;color:var(--testo);cursor:pointer;bottom:calc(var(--h-sheet,168px) + 12px);transition:bottom .28s cubic-bezier(.22,.9,.28,1);}

  /* ---------- Mini-card fermata ---------- */
  .mini{position:fixed;left:12px;right:12px;bottom:calc(var(--h-sheet,168px) + 12px);max-width:520px;margin:0 auto;z-index:950;background:var(--sup);border-radius:var(--r-card);box-shadow:var(--ombra);padding:14px 16px;animation:mini-in .18s ease;}
  @keyframes mini-in{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  .mini-nome{font-size:16px;font-weight:600;letter-spacing:-.2px;margin:0 0 2px;padding-right:36px;}
  .mini-meta{font-size:13px;color:var(--testo-2);margin:0 0 12px;}
  .mini-azioni{display:flex;gap:8px;}
  .mini-azioni .btn{flex:1;}
  .mini-chiudi{position:absolute;top:8px;right:8px;}

  /* ---------- Pulsanti ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:var(--r-card);border:1px solid transparent;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;background:#F2F2F2;color:var(--testo);transition:background .15s;}
  .btn-primario{background:var(--rosso);color:#fff;}
  .btn-primario:active{background:#9E0E19;}
  .btn-tenue{background:#F2F2F2;color:var(--testo);}
  .btn-tenue:active{background:#E7E7E7;}
  .link{border:0;background:transparent;padding:0 4px;min-height:44px;font-size:14px;font-weight:600;color:var(--testo);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

  /* ---------- Bottom sheet ---------- */
  .sheet{position:fixed;left:0;right:0;bottom:0;height:85dvh;max-width:560px;margin:0 auto;background:var(--sup);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -2px 4px rgba(0,0,0,.10);z-index:1100;display:flex;flex-direction:column;will-change:transform;transform:translateY(200px);}
  .grab{padding:10px 0 2px;display:flex;justify-content:center;cursor:grab;flex:0 0 auto;touch-action:none;}
  .grab span{width:36px;height:4px;border-radius:2px;background:var(--bordo-2);}
  .sheet.trascinando{cursor:grabbing;}
  .sheet.trascinando .grab{cursor:grabbing;}
  .sheet-corpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;}
  .sheet-corpo::-webkit-scrollbar{display:none;}
  .vista{display:flex;flex-direction:column;gap:12px;}
  .riga-stato{margin:0;padding:0 16px calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--testo-2);flex:0 0 auto;}
  .riga-stato:not([hidden]){padding-top:4px;}

  /* ---------- Ricerca (dentro il pannello) ---------- */
  .campi{display:flex;flex-direction:column;gap:2px;}
  .campo-riga{display:flex;align-items:center;gap:10px;min-height:44px;}
  .pallino{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .pallino-p{background:var(--rosso);}
  .pallino-d{background:var(--testo);}
  .campo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;border:0;background:transparent;text-align:left;padding:6px 0;cursor:pointer;min-height:44px;}
  .campo .eti{font-size:11px;font-weight:500;color:var(--testo-2);line-height:1.2;}
  .campo .val{font-size:14px;font-weight:500;color:var(--testo);line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .campo .val.vuoto{color:var(--testo-2);font-weight:400;}
  .riga-quando{display:flex;align-items:center;gap:8px;}
  .quando-btn{flex:1;min-height:40px;border:0;background:transparent;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--testo);cursor:pointer;padding:0;text-align:left;}
  .quando-btn svg{color:var(--testo-2);}
  .quando-pannello{display:flex;flex-direction:column;gap:10px;padding:4px 0 2px;}
  .quando-campi{display:flex;gap:8px;}
  .quando-campi input{flex:1;min-width:0;border:1px solid var(--bordo-2);background:var(--sup);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--testo);}
  .quando-campi input::-webkit-calendar-picker-indicator{opacity:.5;}
  .segmento{display:flex;background:#F2F2F2;border-radius:10px;padding:3px;gap:3px;}
  .segmento button{flex:1;min-height:36px;border:0;background:transparent;border-radius:8px;font-size:12px;font-weight:600;color:var(--testo-2);cursor:pointer;}
  .segmento button.attivo{background:var(--sup);color:var(--testo);box-shadow:var(--ombra);}
  .camminata{display:flex;align-items:center;gap:10px;}
  .camminata .eti{font-size:13px;font-weight:500;color:var(--testo-2);white-space:nowrap;}
  .camminata input[type="range"]{flex:1;min-width:0;height:28px;accent-color:var(--rosso);}
  .camminata output{font-size:13px;font-weight:600;min-width:48px;text-align:right;font-variant-numeric:tabular-nums;}

  /* ---------- Riepilogo percorso (HALF) ---------- */
  .riepilogo{display:flex;flex-direction:column;gap:6px;padding-top:4px;}
  .riep-titolo{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1;}
  .riep-meta{font-size:13px;font-weight:500;color:var(--testo-2);}
  .riep-azioni{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .riep-azioni .btn{flex:1;}
  /* Selettore del criterio: due chip, una attiva. Sta dentro il riepilogo,
     quindi sparisce quando il pannello passa al dettaglio. */
  .criteri{display:flex;gap:8px;margin:2px 0 2px;}
  .chip-criterio{min-height:32px;padding:0 12px;border:1px solid #E8E8E8;border-radius:999px;background:var(--sup);color:var(--testo);font-size:13px;font-weight:600;cursor:pointer;}
  .chip-criterio.attiva{background:var(--rosso);border-color:var(--rosso);color:#fff;}
  .criterio-spiega{margin:0;font-size:12px;font-weight:500;color:var(--testo-2);}
  .criterio-riga{margin:8px 0 0;font-size:12px;font-weight:500;color:var(--testo-2);}
  .badge-piano{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:6px;background:#F2F2F2;color:var(--testo-2);font-size:11px;font-weight:600;vertical-align:middle;letter-spacing:0;}
  .badge-piano.ottimo{background:transparent;color:var(--rosso);border:1px solid rgba(193,18,31,.25);}
  .badge-piano.rischio{background:transparent;color:var(--rosso);border:1px solid var(--rosso);}
  .riepilogo{animation:micro-fade .15s ease-out;}
  @media (prefers-reduced-motion: reduce){.riepilogo{animation:none;}}
  @keyframes micro-fade{from{opacity:.4}to{opacity:1}}
  .altre{display:flex;align-items:center;justify-content:space-between;min-height:44px;border:0;border-top:1px solid var(--bordo);background:transparent;font-size:13px;font-weight:600;color:var(--testo);cursor:pointer;padding:0;margin-top:4px;width:100%;}
  .altre svg{color:var(--testo-2);transition:transform .18s;}
  .altre[aria-expanded="true"] svg{transform:rotate(180deg);}

  /* ---------- Opzioni alternative ---------- */
  .opzioni{display:flex;flex-direction:column;}
  .opzione-riga{display:flex;align-items:center;gap:10px;min-height:56px;width:100%;border:0;border-top:1px solid var(--bordo);background:transparent;padding:8px 0;cursor:pointer;text-align:left;}
  .opzione-riga[aria-current="true"]{background:transparent;}
  .opzione-riga .testo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .opzione-riga .orari{font-size:15px;font-weight:600;letter-spacing:-.2px;font-variant-numeric:tabular-nums;}
  .opzione-riga .meta{font-size:12px;color:var(--testo-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .opzione-riga .linee{display:flex;gap:4px;flex:0 0 auto;}
  .linea{min-width:26px;height:22px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:var(--rosso);color:#fff;}
  .linea.treno{background:var(--testo);}
  .opzione-riga[aria-current="true"] .orari{color:var(--rosso);}

  /* ---------- Dettaglio viaggio (FULL) ---------- */
  .sez{font-size:13px;font-weight:600;color:var(--testo);margin:8px 0 0;}
  .dettaglio{border-top:1px solid var(--bordo);padding-top:4px;}
  /* Lo stato del pannello decide quanto se ne vede: il contenuto resta in
     pagina e il CSS lo scopre a poco a poco, senza ridisegnare a ogni gesto. */
  .sheet[data-stato="peek"] .riepilogo,
  .sheet[data-stato="peek"] .altre,
  .sheet[data-stato="peek"] .opzioni,
  .sheet[data-stato="peek"] .dettaglio,
  .sheet[data-stato="meta"] .dettaglio,
  .sheet[data-stato="piena"] .riepilogo{display:none;}
  .viaggio{display:flex;flex-direction:column;}
  .corsa{display:flex;gap:12px;padding:12px 0;}
  .corsa + .corsa,.piedi + .corsa,.corsa + .piedi{border-top:1px solid var(--bordo);}
  .corsa-badge{flex:0 0 auto;width:34px;height:34px;border-radius:8px;background:var(--rosso);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .corsa-badge.treno{background:var(--testo);}
  .corsa-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .corsa-riga{display:flex;align-items:baseline;gap:9px;}
  .corsa-ora{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-width:40px;}
  .corsa-fermata{font-size:14px;overflow-wrap:anywhere;}
  .corsa-info{font-size:12px;color:var(--testo-2);padding-left:49px;}
  .piedi{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--testo-2);padding:10px 0;}
  .piedi svg{color:var(--testo-2);flex:0 0 auto;}
  .piedi b{font-weight:600;color:var(--testo);}
  .cambio{font-size:12px;font-weight:500;color:var(--testo-2);border-top:1px solid var(--bordo);padding:8px 0 2px 48px;}
  .live-percorso{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-top:1px solid var(--bordo);font-size:13px;line-height:1.4;}
  .live-percorso[hidden]{display:none;}
  .tag-live{font-size:9px;font-weight:700;letter-spacing:.6px;padding:3px 6px;border-radius:5px;background:#F2F2F2;color:var(--testo-2);flex:0 0 auto;}
  .tag-orario{font-size:9px;font-weight:700;letter-spacing:.6px;padding:3px 6px;border-radius:5px;background:#F2F2F2;color:var(--testo-2);flex:0 0 auto;}

  /* ---------- Biglietto (card collassabile) ---------- */
  .biglietto{border:1px solid var(--bordo);border-radius:var(--r-card);margin-top:10px;}
  .biglietto summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;}
  .biglietto summary::-webkit-details-marker{display:none;}
  .b-prezzo{font-size:22px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;}
  .b-nota{font-size:12px;color:var(--testo-2);text-align:right;}
  .b-corpo{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;font-size:13px;color:var(--testo-2);}
  .b-stato{font-size:12px;font-weight:600;color:var(--testo);}
  .b-corpo .riga{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--testo);}
  .b-corpo a{font-size:12px;color:var(--testo-2);text-decoration:underline;text-underline-offset:2px;}
  .interruttore{position:relative;width:44px;height:26px;flex:0 0 auto;}
  .interruttore input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;}
  .interruttore .binario{position:absolute;inset:0;border-radius:999px;background:var(--bordo-2);transition:background .18s;pointer-events:none;}
  .interruttore .binario::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .18s;}
  .interruttore input:checked + .binario{background:var(--rosso);}
  .interruttore input:checked + .binario::after{transform:translateX(18px);}
  .micro{font-size:11px;color:var(--testo-2);margin:10px 0 0;line-height:1.5;}
  .avviso{font-size:12px;line-height:1.5;color:var(--testo-2);background:#F7F7F7;border-radius:10px;padding:10px 12px;}
  .box{border:1px solid var(--bordo);border-radius:var(--r-card);padding:14px 16px;font-size:13px;line-height:1.5;color:var(--testo-2);}
  .schema{display:flex;flex-direction:column;gap:8px;}
  .schema span{display:block;height:14px;border-radius:6px;background:#F2F2F2;animation:schema 1.3s ease-in-out infinite;}
  .schema span:nth-child(2){width:64%;}
  @keyframes schema{0%,100%{opacity:.6;}50%{opacity:1;}}

  /* ---------- Elenco fermate ---------- */
  .gruppo{font-size:11px;font-weight:600;color:var(--testo-2);margin:12px 0 2px;}
  .voce{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border:0;background:transparent;cursor:pointer;text-align:left;}
  .voce + .voce{border-top:1px solid var(--bordo);}
  .voce-ico{width:34px;height:34px;border-radius:9px;background:#F2F2F2;color:var(--testo-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .voce-testo{flex:1;min-width:0;}
  .voce-nome{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .voce-indirizzo{display:block;font-size:12px;color:var(--testo-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .voce-meta{display:block;font-size:12px;color:var(--testo-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .voce-freccia{color:var(--bordo-2);flex:0 0 auto;}

  /* ---------- Arrivi (vista orari) ---------- */
  .orari-testa{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .orari-nome{font-size:18px;font-weight:600;letter-spacing:-.3px;margin:0;}
  .orari-pos{font-size:12px;color:var(--testo-2);margin:2px 0 0;}
  .btn-aggiorna{width:44px;height:44px;border:0;border-radius:12px;background:#F2F2F2;color:var(--testo);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .btn-aggiorna.gira svg{animation:gira 1s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}
  .stato-live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--testo-2);}
  .punto{width:6px;height:6px;border-radius:50%;background:var(--rosso);flex:0 0 auto;}
  .punto.off{background:var(--testo-2);}
  .lista-arrivi{list-style:none;margin:0;padding:0;}
  .arrivo{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;}
  .arrivo + .arrivo{border-top:1px solid var(--bordo);}
  .badge-linea{min-width:40px;text-align:center;font-size:13px;font-weight:700;padding:5px 8px;border-radius:8px;background:var(--rosso);color:#fff;}
  .arrivo-testo{flex:1;min-width:0;}
  .arrivo-tempo{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
  .arrivo-tempo .unita{font-size:11px;font-weight:500;color:var(--testo-2);margin-left:3px;}
  .arrivo-meta{font-size:12px;color:var(--testo-2);margin-top:1px;}
  /* Orari programmati della giornata: righe compatte, una per corsa. */
  .orari-giorno{margin-top:14px;border-top:1px solid var(--bordo);padding-top:10px;}
  .orari-titolo{font-size:13px;font-weight:600;color:var(--testo);margin:0 0 2px;}
  .ora-lista{display:flex;flex-direction:column;}
  .ora-riga{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--bordo);}
  .ora-riga:last-child{border-bottom:0;}
  .ora-riga.passato{opacity:.42;}
  .orari-passate{margin:2px 0 4px;}
  .orari-passate summary{font-size:12px;color:var(--testo-2);padding:6px 0;cursor:pointer;}
  .orari-passate summary::marker{color:var(--testo-2);}
  .ora{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-width:46px;}
  .ora-dest{flex:1;min-width:0;font-size:13px;color:var(--testo-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ora-riga .badge-linea{min-width:34px;font-size:12px;padding:4px 6px;}

  /* ---------- Drawer menu ---------- */
  .velo{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:1200;}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:82vw;background:var(--sup);z-index:1210;box-shadow:2px 0 4px rgba(0,0,0,.10);transform:translateX(-100%);transition:transform .24s ease;display:flex;flex-direction:column;}
  .drawer.aperto{transform:translateX(0);}
  .drawer-testa{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 8px 16px;}
  .drawer-testa h2{font-size:18px;font-weight:700;letter-spacing:-.3px;margin:0;}
  .drawer-corpo{flex:1;overflow-y:auto;padding:4px 0 calc(20px + env(safe-area-inset-bottom,0px));}
  .voce-menu{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border:0;background:transparent;text-align:left;font-size:14px;font-weight:500;color:var(--testo);cursor:pointer;}
  .voce-menu .spazio{flex:1;}
  .voce-menu .nota{font-size:12px;color:var(--testo-2);font-weight:400;}
  .voce-menu:active{background:#F7F7F7;}
  .menu-sezione{font-size:11px;font-weight:600;color:var(--testo-2);padding:16px 16px 6px;}
  .menu-recente{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 16px;cursor:pointer;font-size:14px;}
  .menu-recente small{display:block;font-size:12px;color:var(--testo-2);margin-top:2px;}
  .drawer details{border-top:1px solid var(--bordo);margin-top:8px;}
  .drawer details summary{list-style:none;min-height:48px;display:flex;align-items:center;padding:0 16px;font-size:14px;font-weight:500;cursor:pointer;}
  .drawer details summary::-webkit-details-marker{display:none;}
  .drawer .info{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;font-size:12px;line-height:1.6;color:var(--testo-2);}
  .drawer .info h3{font-size:13px;font-weight:600;color:var(--testo);margin:0 0 4px;}
  .drawer .info p{margin:0;}
  .drawer .info a,.drawer .info button{font-size:12px;color:var(--testo);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;text-align:left;}
  .campo-relay{display:flex;gap:8px;}
  .campo-relay input{flex:1;min-width:0;border:1px solid var(--bordo-2);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px;}

  /* ---------- Ricerca a tutto schermo ---------- */
  .cerca{position:fixed;inset:0;background:var(--sup);z-index:1300;display:flex;flex-direction:column;}
  .cerca-testa{display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;border-bottom:1px solid var(--bordo);}
  .cerca-testa input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;font-weight:500;padding:10px 4px;background:transparent;}
  .cerca-lista{flex:1;overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));}
  .cerca-lista .gruppo-titolo,.gruppo-titolo{font-size:11px;font-weight:600;color:var(--testo-2);margin:14px 0 2px;}

  /* ---------- Navigazione ---------- */
  .nav{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:536px;margin:0 auto;z-index:1200;background:var(--sup);border-radius:var(--r-card);box-shadow:var(--ombra);padding:12px 14px;display:flex;align-items:center;gap:12px;}
  .nav-ico{width:40px;height:40px;border-radius:10px;background:#F2F2F2;color:var(--testo);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .nav-testo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .nav-testo b{font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-testo span{font-size:12px;color:var(--testo-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-destra{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;}
  .nav-destra b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .nav-destra span{font-size:11px;color:var(--testo-2);}
  .nav-fondo{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:1200;background:var(--sup);border-top:1px solid var(--bordo);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;}
  .nav-riepilogo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .nav-riepilogo b{font-size:20px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;}
  .nav-riepilogo span{font-size:11px;color:var(--testo-2);}
  .nav-fondo .btn{flex:0 0 auto;padding:0 18px;}
  .nav-fondo .btn-icona{width:44px;padding:0;}
  .pin-utente{position:relative;width:24px;height:24px;pointer-events:none;}
  .pin-utente-punto{position:absolute;inset:4px;border-radius:50%;background:var(--rosso);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);}
  .pin-utente-alone{position:absolute;inset:0;border-radius:50%;background:rgba(193,18,31,.18);animation:alone 2.4s ease-out infinite;}
  @keyframes alone{0%{transform:scale(.7);opacity:.9;}70%{transform:scale(2.2);opacity:0;}100%{opacity:0;}}
  body.in-navigazione .barra,body.in-navigazione .mappa-btn,body.in-navigazione .sheet,body.in-navigazione .mini{display:none !important;}

  @media (prefers-reduced-motion: reduce){*{transition-duration:.001ms !important;animation:none !important;}}
</style>
</head>
<body>
<div id="mappa" role="region" aria-label="Mappa delle fermate"></div>

<header class="barra" id="barra">
  <button class="icona" id="btn-menu" aria-label="Apri il menu" aria-expanded="false" aria-controls="drawer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <button class="icona" id="btn-indietro" aria-label="Torna indietro" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  </button>
  <span class="spazio"></span>
  <span class="pill-offline" id="pill-offline" hidden>Offline</span>
  <button class="icona" id="btn-geo" aria-label="Mostra la mia posizione">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</header>

<button class="mappa-btn" id="btn-inquadra" aria-label="Inquadra il percorso" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
</button>

<div class="mini" id="mini-fermata" hidden role="dialog" aria-label="Fermata selezionata">
  <button class="icona mini-chiudi" id="mini-chiudi" aria-label="Chiudi">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <p class="mini-nome" id="mini-nome"></p>
  <p class="mini-meta" id="mini-meta"></p>
  <div class="mini-azioni">
    <button class="btn btn-primario" data-mini="orari">Orari</button>
    <button class="btn btn-tenue" data-mini="partenza">Partenza</button>
    <button class="btn btn-tenue" data-mini="destinazione">Destinazione</button>
  </div>
</div>

<section class="sheet" id="sheet" aria-label="Percorso e orari">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="Espandi o riduci il pannello"><span></span></div>
  <div class="sheet-corpo" id="sheet-corpo">
    <div class="vista" id="vista-percorso"></div>
    <div class="vista" id="vista-orari" hidden></div>
  </div>
  <p class="riga-stato" id="riga-stato" role="status" aria-live="polite" hidden></p>
</section>

<div class="nav" id="nav" hidden role="status" aria-live="polite">
  <span class="nav-ico" id="nav-ico" aria-hidden="true"></span>
  <div class="nav-testo">
    <b id="nav-titolo">Navigazione</b>
    <span id="nav-sotto">Cerco la tua posizione…</span>
  </div>
  <div class="nav-destra">
    <b id="nav-distanza">…</b>
    <span id="nav-passo"></span>
  </div>
</div>

<div class="nav-fondo" id="nav-fondo" hidden>
  <div class="nav-riepilogo">
    <b id="nav-eta">—</b>
    <span>arrivo previsto</span>
  </div>
  <button type="button" class="btn btn-tenue btn-icona" id="nav-centra" data-azione="centra-navigazione" aria-label="Centra la mappa sulla tua posizione" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button type="button" class="btn btn-primario" data-azione="ferma-navigazione">Termina</button>
</div>

<div class="velo" id="drawer-velo" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Impostazioni" aria-hidden="true">
  <div class="drawer-testa">
    <h2>Impostazioni</h2>
    <button class="icona" id="drawer-chiudi" aria-label="Chiudi il menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-corpo">
    <button class="voce-menu" id="menu-posizione">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span class="spazio">La mia posizione</span>
      <span class="nota" id="menu-posizione-stato">Trova</span>
    </button>
    <label class="voce-menu" for="menu-abbonamento">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      <span class="spazio">Ho l'abbonamento urbano</span>
      <span class="interruttore"><input type="checkbox" id="menu-abbonamento"><span class="binario"></span></span>
    </label>
    <div class="menu-sezione">Percorsi recenti</div>
    <button class="menu-recente" id="menu-recente" hidden></button>
    <p class="menu-sezione" id="menu-recente-vuoto">Nessun percorso ancora.</p>
    <details id="menu-info">
      <summary>Informazioni e fonti dati</summary>
      <div class="info" id="menu-info-corpo"></div>
    </details>
    <button class="voce-menu" id="menu-criterio" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18"/><path d="M12 3v18"/><circle cx="12" cy="12" r="9"/></svg>
      <span class="spazio">Imposta "Ottimizzato" come predefinito</span>
    </button>
    <button class="voce-menu" id="menu-aggiorna" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      <span class="spazio">Aggiorna app</span>
    </button>
    <button class="voce-menu" id="menu-installa" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span class="spazio">Installa app</span>
    </button>
  </div>
</aside>

<div class="cerca" id="cerca" hidden role="dialog" aria-modal="true" aria-label="Cerca fermata, luogo o indirizzo">
  <div class="cerca-testa">
    <button class="icona" id="cerca-indietro" aria-label="Chiudi la ricerca">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
    <input id="cerca-input" type="text" placeholder="Dove vai?" autocomplete="off" enterkeyhint="search" aria-label="Fermata, luogo o indirizzo">
    <button class="icona" id="cerca-pulisci" aria-label="Cancella il testo" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="cerca-lista" id="overlay-lista" role="listbox" aria-label="Fermate, luoghi e indirizzi suggeriti"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
<script src="./routing.js" defer></script>
<script src="./icone.js" defer></script>
<script src="./vista-percorso.js" defer></script>
<script src="./tariffe.js" defer></script>
<script src="./piedi.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
