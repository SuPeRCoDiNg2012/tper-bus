<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muovi Bologna</title>
<meta name="description" content="Muovi Bologna: zone tariffarie, costo del biglietto, percorso e orari in tempo reale dei bus TPER di Bologna e provincia">
<meta name="theme-color" content="#F6F4EF">
<meta name="application-name" content="Muovi Bologna">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muovi Bologna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --rosso:#C1121F;
    --rosso-scuro:#8E0E18;
    --rosso-soft:#FCEDEE;
    --testo:#171717;
    --testo-2:#6B6B6B;
    --testo-3:#9C9C9C;
    --bordo:#EDEAE4;
    --bordo-2:#DFDBD3;
    --sup:#FFFFFF;
    --sfondo:#F6F4EF;
    --sabbia:#F2EEE6;
    --verde:#1B7A3E;
    --verde-soft:#EAF5EC;
    --ambra:#8A6200;
    --ambra-soft:#FBF4E4;
    --r:14px;
    --ombra-1:0 1px 2px rgba(23,23,23,.04), 0 4px 14px rgba(23,23,23,.05);
    --ombra-2:0 8px 28px rgba(23,23,23,.10);
    --font:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--sfondo);color:var(--testo);font-family:var(--font);-webkit-font-smoothing:antialiased;}
  body{font-size:14px;line-height:1.45;}
  button{font-family:inherit;}
  svg{display:block;}
  #mappa{position:fixed;inset:0;background:#EAE6DF;z-index:0;}
  #mappa.senza-mappa{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#F4F1EC,#E9E6E0);}
  #mappa.senza-mappa p{font-size:13px;color:var(--testo-2);background:#fff;border:1px solid var(--bordo);padding:12px 16px;border-radius:12px;}
  .maplibregl-ctrl-bottom-left{bottom:calc(var(--h-sheet,240px) + 6px);z-index:900;}
  .maplibregl-ctrl-attrib{font-size:10px !important;background:rgba(255,255,255,.9) !important;border:1px solid var(--bordo);border-radius:8px;color:var(--testo-2);}
  .maplibregl-ctrl-attrib a{color:var(--testo-2);}
  .maplibregl-ctrl-attrib-button{background-color:transparent;}
  .pin-mappa{cursor:pointer;}
  .pin-mappa svg{filter:drop-shadow(0 2px 4px rgba(23,23,23,.22));transition:transform .15s ease;}
  .pin-mappa:active svg{transform:scale(.95);}

  .velo{position:fixed;left:0;right:0;top:0;height:180px;background:linear-gradient(180deg,rgba(246,244,239,.96) 0%,rgba(246,244,239,.62) 58%,rgba(246,244,239,0) 100%);pointer-events:none;z-index:350;}

  /* ---------- Ricerca ---------- */
  .strato-alto{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;max-width:560px;margin:0 auto;}
  .card-ricerca{display:flex;align-items:center;gap:4px;background:var(--sup);border:1px solid var(--bordo);border-radius:18px;box-shadow:var(--ombra-1);padding:4px 4px 4px 16px;}
  .campi{flex:1;min-width:0;}
  .riga-campo{display:flex;align-items:center;gap:12px;height:46px;}
  .pallino{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .pallino-p{background:var(--rosso);box-shadow:0 0 0 4px rgba(193,18,31,.10);}
  .pallino-d{background:var(--testo);box-shadow:0 0 0 4px rgba(23,23,23,.07);}
  .riga-campo input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;font-weight:500;color:var(--testo);padding:0;font-family:inherit;letter-spacing:-.1px;}
  .riga-campo input::placeholder{color:var(--testo-3);font-weight:400;letter-spacing:0;}
  .btn-pulisci{border:0;background:transparent;padding:7px;border-radius:50%;display:flex;cursor:pointer;color:var(--testo-3);}
  .btn-pulisci:hover{background:var(--sfondo);color:var(--testo-2);}
  .separatore{height:1px;background:var(--bordo);margin-left:22px;}
  .btn-scambia{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--testo-2);cursor:pointer;flex:0 0 auto;transition:background .15s,color .15s;}
  .btn-scambia:hover{background:var(--sfondo);color:var(--rosso);}
  .riga-chip{display:flex;gap:8px;padding:10px 2px 0;overflow-x:auto;scrollbar-width:none;}
  .riga-chip::-webkit-scrollbar{display:none;}
  .chip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;border:1px solid var(--bordo);background:var(--sup);color:var(--testo-2);font-size:12px;font-weight:500;padding:7px 13px;border-radius:999px;box-shadow:var(--ombra-1);cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
  .chip svg{color:var(--testo-3);}
  .chip:hover{color:var(--testo);}
  .chip[aria-pressed="true"]{background:var(--rosso-soft);border-color:rgba(193,18,31,.18);color:var(--rosso-scuro);}
  .chip[aria-pressed="true"] svg{color:var(--rosso);}
  .avviso-aggiorna{display:flex;align-items:center;gap:10px;margin-top:8px;padding:7px 7px 7px 14px;background:var(--sup);border:1px solid var(--bordo);border-radius:999px;box-shadow:var(--ombra-1);font-size:12px;color:var(--testo-2);animation:entra-avviso .18s ease;}
  .avviso-aggiorna span{flex:1;min-width:0;}
  .avviso-aggiorna button{border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;font-weight:600;background:var(--rosso);color:#fff;cursor:pointer;flex:0 0 auto;transition:background .15s;}
  .avviso-aggiorna button:hover{background:var(--rosso-scuro);}
  @keyframes entra-avviso{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Pulsanti flottanti ---------- */
  .col-fab{position:fixed;right:12px;z-index:1000;display:flex;flex-direction:column;gap:8px;bottom:calc(var(--h-sheet,240px) + 12px);transition:bottom .3s cubic-bezier(.2,.8,.2,1),opacity .2s,transform .2s;}
  .col-fab.nascosto{opacity:0;pointer-events:none;transform:translateY(8px);}
  .fab{width:44px;height:44px;border-radius:14px;border:1px solid var(--bordo);background:var(--sup);color:var(--testo-2);box-shadow:var(--ombra-1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .15s,transform .12s;}
  .fab:hover{color:var(--testo);}
  .fab:active{transform:scale(.96);}

  /* ---------- Overlay ricerca ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(23,23,23,.18);z-index:1090;}
  .overlay-ricerca{position:fixed;left:50%;transform:translateX(-50%);top:calc(152px + env(safe-area-inset-top,0px));width:calc(100% - 24px);max-width:536px;max-height:min(68vh,520px);background:var(--sup);border:1px solid var(--bordo);border-radius:16px;box-shadow:var(--ombra-2);z-index:1150;display:flex;flex-direction:column;overflow:hidden;}
  .overlay-testa{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 8px;}
  .overlay-testa span{font-size:14px;font-weight:600;letter-spacing:-.2px;color:var(--testo);}
  .overlay-testa button{border:0;background:transparent;color:var(--rosso);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:7px;}
  .lista-scorrevole{overflow-y:auto;padding:0 6px 8px;overscroll-behavior:contain;}

  /* ---------- Voci fermata ---------- */
  .gruppo-titolo{list-style:none;font-size:10.5px;font-weight:700;color:var(--testo-3);text-transform:uppercase;letter-spacing:.8px;padding:12px 10px 4px;}
  .voce{width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border:0;background:transparent;border-radius:12px;cursor:pointer;text-align:left;transition:background .12s;}
  .voce:hover{background:var(--sfondo);}
  .voce-ico{width:34px;height:34px;border-radius:11px;background:var(--sabbia);color:var(--testo-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .voce-ico.bus{background:var(--rosso-soft);color:var(--rosso);}
  .voce-ico.treno{background:#EFEDE7;color:var(--testo);}
  .voce-ico.geo{background:#E9EEF7;color:#2F5FA8;}
  .voce-ico.luogo{background:var(--verde-soft);color:var(--verde);}
  .voce-testo{flex:1;min-width:0;}
  .voce-nome{display:block;font-size:14px;font-weight:500;color:var(--testo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px;}
  .voce-indirizzo{display:block;font-size:12px;color:var(--testo);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.05px;}
  .voce-meta{display:block;font-size:11.5px;color:var(--testo-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .voce-freccia{color:var(--bordo-2);flex:0 0 auto;}

  /* ---------- Bottom sheet ---------- */
  .sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;height:min(86dvh,760px);background:var(--sup);border-radius:22px 22px 0 0;border-top:1px solid var(--bordo);box-shadow:0 -2px 24px rgba(23,23,23,.08);z-index:1100;display:flex;flex-direction:column;will-change:transform;transform:translate(-50%,200px);}
  .grab{padding:10px 0 4px;display:flex;justify-content:center;cursor:grab;flex:0 0 auto;touch-action:none;}
  .grab span{width:36px;height:4px;border-radius:2px;background:var(--bordo-2);}
  .sheet-testa{padding:4px 18px 0;flex:0 0 auto;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;}
  .sheet.trascinando{cursor:grabbing;}
  .sheet.trascinando .grab{cursor:grabbing;}
  .sheet-testa h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.35px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .sheet-testa p{margin:3px 0 0;font-size:12px;color:var(--testo-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tab{display:flex;gap:4px;margin:12px 16px 0;padding:4px;background:var(--sabbia);border-radius:12px;flex:0 0 auto;}
  .tab button{position:relative;flex:1;border:0;background:transparent;padding:8px 6px;font-size:13px;font-weight:500;color:var(--testo-2);cursor:pointer;border-radius:9px;transition:background .15s,color .15s,box-shadow .15s;letter-spacing:-.1px;}
  .tab button.attivo{background:var(--sup);color:var(--testo);font-weight:600;box-shadow:0 1px 2px rgba(23,23,23,.08);}
  .sheet-corpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain;}
  .pannello{display:flex;flex-direction:column;gap:16px;}

  .sezione-titolo{margin:0;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--testo-3);}
  .testo-intro{font-size:13px;line-height:1.6;color:var(--testo-2);margin:0;}

  .riga-interruttore{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--bordo);}
  .riga-interruttore .etichetta{font-size:13px;font-weight:500;color:var(--testo);}
  .riga-interruttore .sotto{display:block;font-size:11.5px;color:var(--testo-2);margin-top:2px;font-weight:400;}
  .interruttore{position:relative;width:40px;height:24px;flex:0 0 auto;}
  .interruttore input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .interruttore .binario{position:absolute;inset:0;border-radius:999px;background:var(--bordo-2);transition:background .18s;}
  .interruttore .binario::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform .18s;}
  .interruttore input:checked + .binario{background:var(--rosso);}
  .interruttore input:checked + .binario::after{transform:translateX(16px);}

  /* ---------- Biglietto ---------- */
  .biglietto{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r);padding:14px 16px;}
  .biglietto-testo{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .biglietto-nota{font-size:11.5px;color:var(--testo-2);}
  .biglietto-prezzo{font-size:20px;font-weight:600;letter-spacing:-.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pill-stato{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:5px 8px;border-radius:6px;line-height:1.2;}
  .pill-stato.verde{background:var(--verde-soft);color:var(--verde);}
  .pill-stato.arancio{background:var(--ambra-soft);color:var(--ambra);}
  .pill-stato.rosso{background:var(--rosso-soft);color:var(--rosso-scuro);}
  .pill-stato.info{background:var(--sabbia);color:var(--testo-2);}

  /* ---------- Percorso ---------- */
  .blocco-percorso{display:flex;flex-direction:column;gap:12px;}
  .quando{display:flex;align-items:center;gap:6px;background:var(--sup);border:1px solid var(--bordo);border-radius:12px;padding:3px 4px 3px 12px;}
  .quando > svg{color:var(--testo-3);flex:0 0 auto;}
  .quando input{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--testo);padding:8px 2px;outline:0;min-width:0;font-variant-numeric:tabular-nums;}
  .quando input[type="date"]{width:120px;}
  .quando input[type="time"]{width:88px;}
  .quando input::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer;}
  .quando .sep{width:1px;height:18px;background:var(--bordo);flex:0 0 auto;margin:0 2px;}
  .quando .adesso{margin-left:auto;border:0;background:transparent;color:var(--testo-2);font-size:11.5px;font-weight:600;padding:8px 9px;border-radius:8px;cursor:pointer;transition:color .15s,background .15s;}
  .quando .adesso:hover{color:var(--rosso);background:var(--rosso-soft);}

  .modo-quando{display:flex;gap:2px;background:var(--sfondo);border:1px solid var(--bordo);border-radius:500px;padding:3px;}
  .modo-quando button{flex:1;border:0;background:transparent;border-radius:500px;padding:7px 10px;font:inherit;font-size:12px;font-weight:600;color:var(--testo-2);cursor:pointer;transition:background .15s,color .15s;}
  .modo-quando button.attivo{background:var(--sup);color:var(--testo);box-shadow:var(--ombra-1);}

  .riepilogo{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r);padding:14px 16px;}
  .riep-orari{display:flex;align-items:baseline;gap:8px;font-size:22px;font-weight:600;letter-spacing:-.7px;font-variant-numeric:tabular-nums;}
  .riep-orari .freccia{color:var(--testo-3);font-size:15px;font-weight:400;letter-spacing:0;}
  .riep-durata{text-align:right;font-size:11.5px;color:var(--testo-2);line-height:1.4;}
  .riep-durata b{display:block;font-size:13px;font-weight:600;color:var(--testo);letter-spacing:-.1px;}

  /* Opzioni di percorso: chiuse come righe compatte, si aprono al clic. */
  .opzioni{display:flex;flex-direction:column;gap:8px;}
  .opzione{background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r);overflow:hidden;}
  .opzione[open]{border-color:var(--bordo-2);box-shadow:var(--ombra-1);}
  .opzione-testa{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none;}
  .opzione-testa::-webkit-details-marker{display:none;}
  .opzione-orari{display:flex;align-items:baseline;gap:5px;font-size:16px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .opzione-orari .freccia{color:var(--testo-3);font-size:12px;font-weight:400;}
  .opzione-meta{font-size:11.5px;color:var(--testo-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .opzione-linee{display:flex;gap:3px;margin-left:auto;flex:0 0 auto;max-width:46%;overflow:hidden;}
  .opzione-linea{min-width:24px;height:20px;padding:0 5px;border-radius:6px;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:var(--rosso-soft);color:var(--rosso-scuro);flex:0 0 auto;}
  .opzione-linea.treno{background:var(--sabbia);color:var(--testo);}
  .opzione-piedi{width:20px;height:20px;border-radius:6px;background:var(--sfondo);color:var(--testo-2);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .opzione-piedi svg{width:14px;height:14px;}
  .opzione-freccia{color:var(--testo-3);flex:0 0 auto;transition:transform .18s;}
  .opzione[open] .opzione-freccia{transform:rotate(180deg);}
  .opzione-corpo .viaggio{border:0;border-top:1px solid var(--bordo);border-radius:0;padding:2px 14px;}
  @media (max-width: 390px){.opzione-meta{display:none;}}

  .viaggio{display:flex;flex-direction:column;background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r);padding:2px 15px;}
  .corsa{display:flex;gap:12px;padding:12px 0;}
  .corsa-badge{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--rosso-soft);color:var(--rosso-scuro);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:-.3px;}
  .corsa-badge.treno{background:var(--sabbia);color:var(--testo);}
  .corsa-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .corsa-riga{display:flex;align-items:baseline;gap:9px;}
  .corsa-ora{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--testo);min-width:40px;}
  .corsa-fermata{font-size:13px;color:var(--testo);letter-spacing:-.1px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .corsa-info{font-size:11.5px;color:var(--testo-2);padding-left:49px;}
  .piedi{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--testo-2);padding:10px 0;}
  .piedi + .corsa,.corsa + .piedi{border-top:1px solid var(--bordo);}
  .piedi svg{color:var(--testo-3);flex:0 0 auto;}
  .piedi b{font-weight:500;color:var(--testo);}
  .cambio{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--testo-2);border-top:1px solid var(--bordo);padding:10px 0 2px 50px;letter-spacing:.1px;}
  .nota-piccola{font-size:11px;color:var(--testo-3);margin:0;line-height:1.55;}
  .scheletro{display:flex;flex-direction:column;gap:8px;}
  .scheletro span{display:block;height:12px;border-radius:6px;background:var(--sabbia);animation:pulsa-scheletro 1.4s ease-in-out infinite;}
  .scheletro span:nth-child(2){width:70%;}
  @keyframes pulsa-scheletro{0%,100%{opacity:.55;}50%{opacity:1;}}

  /* ---------- Tempo reale ---------- */
  .live-intesta{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .live-intesta .live-nome{font-size:15px;font-weight:600;margin-top:4px;letter-spacing:-.2px;}
  .live-indirizzo{font-size:12.5px;color:var(--testo);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.05px;}
  .btn-aggiorna{width:36px;height:36px;border-radius:11px;border:1px solid var(--bordo);background:var(--sup);color:var(--testo-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:background .15s;}
  .btn-aggiorna:hover{background:var(--sfondo);}
  .btn-aggiorna:disabled{opacity:.4;cursor:default;}
  .btn-aggiorna.gira svg{animation:gira 1s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}

  .segmented{display:flex;background:var(--sabbia);border-radius:11px;padding:3px;gap:3px;}
  .segmented button{flex:1;border:0;background:transparent;font-size:12px;font-weight:500;color:var(--testo-2);padding:8px 12px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s;}
  .segmented button.attivo{background:var(--sup);color:var(--testo);box-shadow:0 1px 2px rgba(23,23,23,.08);}

  .stato-live{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--testo-2);}
  .punto-live{width:6px;height:6px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(27,122,62,.4);animation:pulsa 2.4s infinite;}
  .punto-live.off{background:var(--testo-3);animation:none;box-shadow:none;}
  @keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(27,122,62,.35);}70%{box-shadow:0 0 0 7px rgba(27,122,62,0);}100%{box-shadow:0 0 0 0 rgba(27,122,62,0);}}

  .lista-arrivi{list-style:none;margin:0;padding:0;border:1px solid var(--bordo);border-radius:var(--r);overflow:hidden;background:var(--sup);}
  .arrivo{display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .arrivo + .arrivo{border-top:1px solid var(--bordo);}
  .badge-linea{min-width:44px;text-align:center;font-size:13px;font-weight:700;padding:6px 8px;border-radius:8px;background:var(--rosso-soft);color:var(--rosso-scuro);letter-spacing:-.2px;}
  .arrivo-testo{flex:1;min-width:0;}
  .arrivo-tempo{font-size:15px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
  .arrivo-tempo .unita{font-size:11px;font-weight:400;color:var(--testo-2);margin-left:3px;letter-spacing:0;}
  .arrivo-meta{font-size:11.5px;color:var(--testo-2);margin-top:2px;}
  .tag-live{font-size:9px;font-weight:700;letter-spacing:.7px;padding:3px 6px;border-radius:5px;background:var(--verde-soft);color:var(--verde);}
  .tag-orario{font-size:9px;font-weight:700;letter-spacing:.7px;padding:3px 6px;border-radius:5px;background:var(--sabbia);color:var(--testo-2);}
  .icona-pedana{color:var(--testo-3);display:flex;}

  .box-messaggio{border:1px solid var(--bordo);border-radius:var(--r);padding:14px 15px;font-size:12.5px;line-height:1.6;color:var(--testo-2);background:var(--sfondo);}
  .box-messaggio.errore{background:var(--rosso-soft);border-color:rgba(193,18,31,.14);color:var(--rosso-scuro);}
  .box-messaggio .btn{margin-top:12px;}

  .scheda{display:flex;flex-direction:column;gap:7px;border:1px solid var(--bordo);border-radius:var(--r);padding:15px 16px;}
  .scheda h2{margin:0;font-size:13px;font-weight:600;letter-spacing:-.1px;}
  .scheda p{margin:0;font-size:12px;line-height:1.6;color:var(--testo-2);}
  .scheda .mini{border:1px solid var(--bordo-2);background:var(--sup);color:var(--testo);font-size:12px;font-weight:500;padding:8px 12px;border-radius:9px;align-self:flex-start;cursor:pointer;transition:background .15s;text-decoration:none;}
  .scheda .mini:hover{background:var(--sfondo);}
  .campo-proxy{display:flex;gap:8px;margin-top:2px;}
  .campo-proxy input{flex:1;min-width:0;border:1px solid var(--bordo-2);border-radius:9px;padding:9px 11px;font-size:12px;font-family:inherit;color:var(--testo);outline:0;background:var(--sup);}
  .campo-proxy input:focus{border-color:var(--testo-2);}

  /* ---------- Azioni ---------- */
  .azioni{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:12px 16px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s,transform .12s;}
  .btn:active{transform:scale(.99);}
  .btn-primario{background:var(--rosso);color:#fff;}
  .btn-primario:hover{background:var(--rosso-scuro);}
  .btn-secondario{background:var(--sup);border-color:var(--bordo-2);color:var(--testo);}
  .btn-secondario:hover{background:var(--sfondo);}
  .link-ufficiale{font-size:11.5px;color:var(--testo-3);text-decoration:underline;text-underline-offset:2px;align-self:flex-start;}
  .link-ufficiale:hover{color:var(--testo-2);}
  .avviso{display:flex;gap:9px;background:var(--ambra-soft);border-radius:11px;padding:11px 13px;font-size:12px;line-height:1.55;color:#5C4200;}
  .avviso svg{flex:0 0 auto;margin-top:1px;color:var(--ambra);}
  .nota-tracciato{margin-top:10px;}

  /* ---------- Navigazione ---------- */
  .nav{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:calc(100% - 24px);max-width:536px;z-index:1200;background:var(--sup);border:1px solid var(--bordo);border-radius:18px;box-shadow:var(--ombra-2);padding:12px 14px;display:flex;align-items:center;gap:12px;}
  .nav-ico{width:42px;height:42px;border-radius:13px;background:var(--rosso-soft);color:var(--rosso);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .nav-ico.piedi{background:var(--sabbia);color:var(--testo);}
  .nav-ico.treno{background:#EFEDE7;color:var(--testo);}
  .nav-testo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .nav-testo b{font-size:15px;font-weight:600;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-testo span{font-size:12px;color:var(--testo-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-destra{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
  .nav-destra b{font-size:15px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .nav-destra span{font-size:11px;color:var(--testo-3);font-variant-numeric:tabular-nums;}
  .nav-fondo{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:1200;background:var(--sup);border-top:1px solid var(--bordo);border-radius:20px 20px 0 0;box-shadow:0 -2px 24px rgba(23,23,23,.10);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;}
  .nav-riepilogo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .nav-riepilogo b{font-size:17px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.2;}
  .nav-riepilogo span{font-size:11px;color:var(--testo-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-fondo .btn{flex:0 0 auto;padding:12px 18px;}
  .nav-fondo .btn-icona{width:44px;padding:0;}
  .btn-naviga{width:100%;padding:13px 16px;font-weight:600;font-size:14px;}
  .pin-utente{position:relative;width:24px;height:24px;pointer-events:none;}
  .pin-utente-punto{position:absolute;inset:4px;border-radius:50%;background:#1A73E8;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(23,23,23,.35);}
  .pin-utente-alone{position:absolute;inset:0;border-radius:50%;background:rgba(26,115,232,.22);animation:alone 2.4s ease-out infinite;}
  @keyframes alone{0%{transform:scale(.7);opacity:.9;}70%{transform:scale(2.2);opacity:0;}100%{opacity:0;}}
  /* Durante la navigazione la mappa resta libera: si nascondono pannello e ricerca. */
  body.in-navigazione .strato-alto,
  body.in-navigazione .velo,
  body.in-navigazione .col-fab,
  body.in-navigazione .sheet,
  body.in-navigazione .scrim-basso{display:none !important;}

  /* ---------- Toast / banner ---------- */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(min(var(--h-sheet,240px),60vh) + 16px);z-index:1300;background:var(--testo);color:#fff;font-size:12px;padding:10px 16px;border-radius:10px;box-shadow:var(--ombra-2);max-width:calc(100% - 40px);text-align:center;animation:entra-toast .18s ease;}
  @keyframes entra-toast{from{opacity:0;transform:translate(-50%,6px);}to{opacity:1;transform:translate(-50%,0);}}
  .banner-installa{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(min(var(--h-sheet,240px),55vh) + 12px);width:calc(100% - 32px);max-width:520px;background:var(--sup);border:1px solid var(--bordo);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--ombra-2);z-index:1200;}
  .banner-installa p{margin:0;font-size:12px;flex:1;line-height:1.5;}
  .banner-installa button{border:0;border-radius:9px;padding:9px 14px;font-size:12px;font-weight:500;cursor:pointer;background:var(--rosso);color:#fff;}
  .banner-installa .chiudi{background:transparent;color:var(--testo-3);padding:9px 8px;}
  /* Sfumatura sul bordo inferiore: il contenuto del pannello continua sotto
     lo schermo e il taglio netto a metà riga sembrava un errore. */
  .scrim-basso{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;height:26px;background:linear-gradient(to top,var(--sup) 42%,rgba(255,255,255,0));z-index:1110;pointer-events:none;}

  [hidden]{display:none !important;}
  :focus-visible{outline:2px solid var(--rosso);outline-offset:2px;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--bordo-2);border-radius:3px;}
  @media (prefers-reduced-motion: reduce){*{transition-duration:.001ms !important;animation:none !important;}}
</style>
</head>
<body>
<div id="mappa" role="region" aria-label="Mappa delle fermate"></div>
<div class="velo" aria-hidden="true"></div>

<div class="strato-alto">
  <div class="card-ricerca">
    <div class="campi">
      <div class="riga-campo">
        <span class="pallino pallino-p" aria-hidden="true"></span>
        <input id="input-partenza" type="text" placeholder="Da dove parti?" autocomplete="off" enterkeyhint="search" aria-label="Fermata, luogo o indirizzo di partenza">
        <button class="btn-pulisci" data-pulisci="partenza" aria-label="Cancella partenza" hidden>
          <svg class="lucide lucide-x" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="separatore"></div>
      <div class="riga-campo">
        <span class="pallino pallino-d" aria-hidden="true"></span>
        <input id="input-destinazione" type="text" placeholder="Dove vai?" autocomplete="off" enterkeyhint="search" aria-label="Fermata, luogo o indirizzo di destinazione">
        <button class="btn-pulisci" data-pulisci="destinazione" aria-label="Cancella destinazione" hidden>
          <svg class="lucide lucide-x" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
    <button class="btn-scambia" id="btn-scambia" aria-label="Inverti partenza e destinazione">
      <svg class="lucide lucide-arrow-up-down" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
    </button>
  </div>
  <div class="riga-chip">
    <button class="chip" id="chip-abbonamento" aria-pressed="false">
      <svg class="lucide lucide-credit-card" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
      Abbonamento urbano
    </button>
    <button class="chip" id="chip-vicino">
      <svg class="lucide lucide-crosshair" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></svg>
      Vicino a me
    </button>
  </div>
  <div class="avviso-aggiorna" id="avviso-aggiorna" role="status" aria-live="polite" hidden>
    <span>Nuova versione disponibile</span>
    <button type="button" id="btn-aggiorna">Aggiorna</button>
  </div>
</div>

<div class="col-fab">
  <button class="fab" id="btn-inquadra" aria-label="Inquadra il viaggio sulla mappa">
    <svg class="lucide lucide-maximize" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
  <button class="fab" id="btn-geo" aria-label="Mostra le fermate vicino a me">
    <svg class="lucide lucide-locate-fixed" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>

<div class="nav" id="nav" hidden role="status" aria-live="polite">
  <span class="nav-ico" id="nav-ico" aria-hidden="true"></span>
  <div class="nav-testo">
    <b id="nav-titolo">Navigazione</b>
    <span id="nav-sotto">Cerco la tua posizione…</span>
  </div>
  <div class="nav-destra">
    <b id="nav-distanza">…</b>
    <span id="nav-passo"></span>
  </div>
</div>

<div class="nav-fondo" id="nav-fondo" hidden>
  <div class="nav-riepilogo">
    <b id="nav-eta">—</b>
    <span>arrivo previsto</span>
  </div>
  <button type="button" class="btn btn-secondario btn-icona" id="nav-centra" data-azione="centra-navigazione" aria-label="Centra la mappa sulla tua posizione" hidden>
    <svg class="lucide lucide-locate-fixed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button type="button" class="btn btn-primario" data-azione="ferma-navigazione">Termina</button>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="overlay-ricerca" id="overlay-ricerca" hidden>
  <div class="overlay-testa">
    <span id="overlay-titolo">Suggerimenti</span>
    <button id="overlay-chiudi">Chiudi</button>
  </div>
  <div class="lista-scorrevole" id="overlay-lista" role="listbox" aria-label="Fermate, luoghi e indirizzi suggeriti"></div>
</div>

<section class="sheet" id="sheet" aria-label="Viaggio e orari">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="Espandi o riduci il pannello"><span></span></div>
  <div class="sheet-testa" id="sheet-testa">
    <h1 id="sheet-titolo">Pianifica il tuo viaggio</h1>
    <p id="sheet-sotto">Zone, biglietto e bus in arrivo</p>
  </div>
  <div class="tab" role="tablist" aria-label="Sezioni" aria-orientation="horizontal">
    <button type="button" role="tab" id="tab-viaggio" data-tab="viaggio" aria-controls="pane-viaggio" aria-selected="true" tabindex="0" class="attivo">Viaggio</button>
    <button type="button" role="tab" id="tab-live" data-tab="live" aria-controls="pane-live" aria-selected="false" tabindex="-1">In tempo reale</button>
    <button type="button" role="tab" id="tab-info" data-tab="info" aria-controls="pane-info" aria-selected="false" tabindex="-1">Info</button>
  </div>
  <div class="sheet-corpo" id="sheet-corpo">
    <div class="pannello" id="pane-viaggio" role="tabpanel" aria-labelledby="tab-viaggio"></div>
    <div class="pannello" id="pane-live" role="tabpanel" aria-labelledby="tab-live" hidden></div>
    <div class="pannello" id="pane-info" role="tabpanel" aria-labelledby="tab-info" hidden></div>
  </div>
</section>

<div class="scrim-basso" id="scrim-basso" aria-hidden="true"></div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<div class="banner-installa" id="banner-installa" hidden>
  <p>Installa Muovi Bologna sulla schermata home per un accesso rapido, anche offline.</p>
  <button id="btn-installa">Installa</button>
  <button class="chiudi" id="btn-chiudi-banner" aria-label="Chiudi">✕</button>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
<script src="./routing.js" defer></script>
<script src="./icone.js" defer></script>
<script src="./vista-percorso.js" defer></script>
<script src="./tariffe.js" defer></script>
<script src="./piedi.js" defer></script>
<script src="./tracciato.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
